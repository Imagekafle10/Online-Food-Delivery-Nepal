name: Build and Release Android APK

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build APK and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable

      - name: Create Maps configuration
        env:
          MAPS_ENV_JSON: ${{ secrets.MAPS_ENV_JSON }}
        run: |
          printf '%s' "$MAPS_ENV_JSON" > app/maps.env.json

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release --dart-define-from-file=maps.env.json

      - name: Rename APK
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk \
             Hotel-Management-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Hotel Management App ${{ github.ref_name }}
          generate_release_notes: true
          files: Hotel-Management-${{ github.ref_name }}.apk
