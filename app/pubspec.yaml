name: bhansa
description: Bhansa — online food/room/table booking app for the multi-hotel/restaurant/cafe platform.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  socket_io_client: ^2.0.3+1
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  webview_flutter: ^4.7.0
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  url_launcher: ^6.3.0 # ← add this
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/legacy_launcher.png
    - assets/images/adaptive_foreground.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/legacy_launcher.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/adaptive_foreground.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
